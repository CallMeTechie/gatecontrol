# GateControl Home Gateway — Example docker-compose
# Copy to docker-compose.yml and adjust to your environment.
#
# Requirements:
#   - gateway.env from GateControl UI (Peer-Detail → Download)
#   - Gateway must be on same L2 segment as target LAN devices (WoL!)
#   - Host network mode required for dynamic L4 port binding
#
# Ports im LAN (nur wenn in GateControl eingeschaltet, nur LAN-Adressen, nie Tunnel):
#   53/udp+tcp  DNS-Filter (docs/dns-cache.md) – belegt ein anderer Dienst
#               (z. B. DSM-Paket „DNS Server“, Pi-hole) Port 53, meldet das
#               Gateway „port_busy“ und erzwingt nichts.
#   8443/tcp    Zwischenspeicher (HTTPS, selbstsigniert, signierte Links)
#   8090/8091   deCONZ/Phoscon (REST + WebSocket, nur mit Zigbee, alle Adressen)
#   zigbee2mqtt öffnet keinen Port (nur MQTT an 127.0.0.1); der Thread Border
#   Router nur 127.0.0.1:8081/8089 und mDNS (UDP 5353) im LAN
# Kameras (docs/cameras.md) öffnen keinen Port; das Gateway sucht sie per
# WS-Discovery (UDP 3702, Multicast im LAN) und spricht sie selbst an.

services:
  gateway:
    image: ghcr.io/callmetechie/gatecontrol-gateway:latest
    restart: unless-stopped
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN         # for wg-quick + TUN device
      - NET_BIND_SERVICE  # for L4 routes on ports <1024 (DNS, HTTP, SSH, HTTPS)
      - NET_RAW           # keepalived VRRP (raw socket proto-112) + GARP (AF_PACKET); NET_ADMIN does NOT cover this
      - SETGID            # keepalived enable_script_security: drops to script_user via setgid/setgroups when exec'ing chk_tunnel — fails (script skipped) under cap_drop:ALL without this
      - SETUID            # keepalived enable_script_security: setuid to script_user for the health-check script
    # security_opt.no-new-privileges NOT set: incompatible with non-root-user +
    # cap_add NET_ADMIN on Linux — wg-quick shell-script calls `ip`/`iptables`
    # that need ambient NET_ADMIN, which no-new-privileges blocks for UID != 0.
    # Compensating controls: cap_drop:ALL, read_only, USER gateway, seccomp-default.
    read_only: true
    # Container runs as root (UID 0) — wg-quick requires it (line 85: exec sudo
     # if $UID != 0, and sudo is not installed in the image). Security is
     # enforced via cap_drop: ALL + minimal caps. Root inside this container
     # has ONLY CAP_NET_ADMIN + CAP_NET_BIND_SERVICE + CAP_NET_RAW + CAP_SETGID + CAP_SETUID.
    user: "0:0"
    # TUN device needed by wireguard-go (userspace WG impl).
    # On some hosts (Synology DSM, minimal VMs, LXC containers) the device must be
    # explicitly passed through. Requires `modprobe tun` on host if /dev/net/tun missing.
    devices:
      - /dev/net/tun:/dev/net/tun
    tmpfs:
      - /tmp
      - /run       # includes /run/keepalived (NearManager mkdir's at runtime)
      - /etc/wireguard  # wireguard-go writes config here
    volumes:
      - ./config:/config:ro      # Place gateway.env here
      - ./gateway-state:/state          # rw: self-update flag + last-pull marker (#2b)
      # Zwischenspeicher (docs/dns-cache.md): Blobs für Apps im Heimnetz. Auf der
      # Synology z. B. GC_CACHE_DIR=/volume1/gatecontrol-cache in .env setzen.
      - ${GC_CACHE_DIR:-./gateway-cache}:/cache
      # Edge-Container (docs/edge.md): Gateway-Socket (+ Netzgrenzen-Marker
      # für alte Compose-Dateien) hin, Zusammenfassung für die Telemetrie
      # zurück, Broker-Dateien für mqtt. Ohne Edge-Dienst weglassen.
      - type: volume
        source: edge-run
        target: /run/gc-edge
        volume: { nocopy: true }
      - type: volume
        source: edge-status
        target: /run/gc-edge-status
        read_only: true
        volume: { nocopy: true }
      - type: volume
        source: edge-mqtt-conf
        target: /gc-mqtt-conf
        volume: { nocopy: true }
      # nur damit ein neues Volume Besitzer 61001 aus dem Image übernimmt;
      # der Gateway-Container selbst kann den Ordner nicht lesen
      - type: volume
        source: edge-mqtt
        target: /gc-mqtt
        read_only: true
      - type: volume            # Funk (docs/radio.md): Steuerdateien für deconz, zigbee2mqtt und otbr
        source: radio-ctl
        target: /gc-radio
        volume: { nocopy: true }
      - type: volume            # Lokale KI (docs/local-ai.md): Steuerdatei für den Dienst ki
        source: ai-ctl
        target: /gc-ai
        volume: { nocopy: true }
      - type: volume            # Kameras (docs/cameras.md): Steuerdateien und Bild-Ring des Dienstes kameras
        source: cam-ctl
        target: /gc-cam
        volume: { nocopy: true }
      # Kameras: Clips und Vorschaubilder. Standard ist ein benanntes Volume; auf der
      # Synology z. B. GC_CAMERA_DIR=/volume1/kameras in .env für einen Ordner der NAS.
      - ${GC_CAMERA_DIR:-cam-recordings}:/recordings
    environment:
      - LOG_LEVEL=info
      - GATEWAY_ENV_PATH=/config/gateway.env
      # Force wg-quick to use wireguard-go (userspace) instead of kernel module.
      # Required on Synology DSM, Alpine containers w/o wg-kernel-module, VMs etc.
      # (Also baked into Dockerfile as ENV — overrideable here.)
      - WG_QUICK_USERSPACE_IMPLEMENTATION=wireguard-go
      # Ortszeit für Portscan-Fenster, Speedtest-Plan und DNS-Zeiten. Schickt
      # der Server eine Zeitzone (ab GateControl mit Phase 3b), gilt diese;
      # TZ ist nur der Rückfall (ohne beides: UTC).
      - TZ=${TZ:-Etc/UTC}
    healthcheck:
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Edge-Container für Plugin-Teile im Heimnetz (docs/edge.md). Dasselbe Image
  # wie das Gateway, anderer Befehl; läuft ohne Rechte und OHNE NETZ als
  # Benutzer 61001: Server, LAN-Geräte und MQTT erreicht er nur über den
  # Gateway-Socket in edge-run – das Gateway prüft jede Anfrage (nur LAN, nur
  # genehmigte Fähigkeiten). Keine Netzgrenze, kein Kernel-Modul nötig.
  # Bleibt untätig, bis der Server Edge für dieses Gateway einschaltet.
  # Wer Edge nicht nutzen will, kann den Dienst (und die Volumes) weglassen.
  edge:
    image: ghcr.io/callmetechie/gatecontrol-gateway:latest
    entrypoint: ["/sbin/tini", "--", "node", "src/edge/main.js"]
    restart: unless-stopped
    network_mode: none        # kein Netz: Server, LAN und MQTT über den Gateway-Socket
    user: "61001:61001"       # feste UID/GID: Gruppe 61001 darf an den Gateway-Socket
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 512m
    pids_limit: 256
    volumes:
      - type: volume
        source: edge-run
        target: /run/gc-edge
        read_only: true
        volume: { nocopy: true }
      - type: volume
        source: edge-status
        target: /run/gc-edge-status
        volume: { nocopy: true }
      - edge-state:/state-edge
    environment:
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "node", "src/edge/healthcheck.js"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Lokaler MQTT-Broker (docs/edge.md "MQTT"). Läuft untätig (nur ein kleiner
  # Wächter), bis der Server MQTT einschaltet; der Gateway-Container schreibt
  # dann mosquitto.conf/passwd/acl nach /gc-mqtt-conf (der Edge-Container
  # kommt da nicht dran). Der Wächter kopiert sie nach /gc-mqtt, startet
  # Mosquitto bei geänderter Konfiguration neu und schickt bei geänderten
  # Konten SIGHUP. Port 1883 nur an LAN-Adressen, ohne anonyme Anmeldung.
  mqtt:
    image: eclipse-mosquitto:2.1.2-alpine@sha256:860aeb5d63ce509508f6dcfb2bc8a1c1dd2bc60555b562b45ce90e52d8dabb0f
    entrypoint:
      - /bin/sh
      - -c
      - |
        G=/gc-mqtt-conf; C=/gc-mqtt; p=""; s=""; r=""
        halt() { if [ -n "$$p" ]; then kill "$$p" 2>/dev/null; wait "$$p" 2>/dev/null; fi; p=""; }
        take() { for f in mosquitto.conf passwd acl; do cp "$$G/$$f" "$$C/.$$f" && chmod 600 "$$C/.$$f" && mv -f "$$C/.$$f" "$$C/$$f" || return 1; done; }
        trap 'halt; exit 0' TERM INT
        mkdir -p "$$C/data"
        while :; do
          if [ -f "$$G/enabled" ] && [ -f "$$G/mosquitto.conf" ]; then
            n="$$(cksum < "$$G/mosquitto.conf")"
            if [ -n "$$p" ] && ! kill -0 "$$p" 2>/dev/null; then p=""; fi
            if [ -z "$$p" ] || [ "$$n" != "$$s" ]; then
              halt; r="$$(cat "$$G/reload" 2>/dev/null)"
              if take; then mosquitto -c "$$C/mosquitto.conf" & p=$$!; s="$$n"; fi
            elif [ "$$(cat "$$G/reload" 2>/dev/null)" != "$$r" ]; then
              r="$$(cat "$$G/reload" 2>/dev/null)"; take && kill -HUP "$$p"
            fi
          else
            halt; s=""
          fi
          sleep 2 & wait $$!
        done
    restart: unless-stopped
    network_mode: host
    user: "61001:61001"       # Gruppe 61001: liest die Dateien des Gateways
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    mem_limit: 128m
    pids_limit: 32
    depends_on:
      - gateway               # legt die Volumes an (edge-mqtt mit Besitzer 61001 aus dem Image)
    volumes:
      - type: volume          # Broker-Dateien vom Gateway (nur lesen)
        source: edge-mqtt-conf
        target: /gc-mqtt-conf
        read_only: true
        volume: { nocopy: true }
      - type: volume          # Kopie der Dateien (0600) + Mosquitto-Daten (data/)
        source: edge-mqtt
        target: /gc-mqtt
        volume: { nocopy: true }
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Zigbee mit deCONZ/Phoscon (docs/radio.md) – nur mit einem Funkmodul von
  # dresden elektronik (ConBee II/III, RaspBee). Profil "zigbee": startet nur mit
  # `docker compose --profile zigbee up -d` (oder COMPOSE_PROFILES=zigbee in
  # .env) – ohne Stick lädt niemand das große Image. Die Datei aus GateControl
  # („docker-compose.yml herunterladen“) enthält den Dienst ohne Profil, sobald
  # das Gateway einen Stick meldet.
  # Ein- und ausgeschaltet wird in GateControl: das Gateway schreibt
  # /gc-radio/zigbee.env (Gerät, major:minor), der kleine Wächter legt genau
  # diesen Geräteknoten an und startet deCONZ – ohne `devices:` (scheitert ohne
  # Stick) und ohne /dev einzubinden; ein später eingesteckter Stick geht so ohne
  # neuen Container. Ohne zigbee.env läuft nur der Wächter.
  deconz:
    profiles: ["zigbee"]
    image: deconzcommunity/deconz:2.33.2@sha256:3defae1287ecc1a73b68279e12579a5a5e997a83f4ff785fe4bc30f21faf8015
    entrypoint:
      - /bin/sh
      - -c
      - |
        C=/gc-radio; p=""; s=""; st=idle; dt=-
        say() { st="$$1"; dt="$${2:--}"; printf '%s %s %s\n' "$$st" "$$dt" "$$(date +%s)" >"$$C/.deconz.state" && mv -f "$$C/.deconz.state" "$$C/deconz.state"; }
        halt() { if [ -n "$$p" ]; then kill "$$p" 2>/dev/null; wait "$$p" 2>/dev/null; fi; p=""; }
        dead() { [ ! -e "/proc/$$1" ] || grep -q '^State:[[:space:]]*Z' "/proc/$$1/status" 2>/dev/null; }
        trap 'halt; say idle; exit 0' TERM INT
        while :; do
          if [ -f "$$C/zigbee.env" ]; then
            n="$$(cksum <"$$C/zigbee.env")"
            if [ -n "$$p" ] && dead "$$p"; then wait "$$p"; say exit "$$?"; p=""; sleep 8; fi
            if [ -z "$$p" ] || [ "$$n" != "$$s" ]; then
              halt; s="$$n"
              dv="$$(sed -n 's/^DEVICE=\(tty[A-Z]\{3\}[0-9]\{1,3\}\)$$/\1/p' "$$C/zigbee.env")"
              mm="$$(sed -n 's/^DEV=\([0-9]\{3\}\):\([0-9]\{1,7\}\)$$/\1 \2/p' "$$C/zigbee.env")"
              bd="$$(sed -n 's/^BAUD=\([0-9]\{1,6\}\)$$/\1/p' "$$C/zigbee.env")"
              case "$$dv:$${mm%% *}" in
                ttyACM*:166|ttyUSB*:188|ttyAMA*:204)
                  rm -f "/dev/$$dv"
                  if mknod "/dev/$$dv" c $$mm && chgrp dialout "/dev/$$dv" && chmod 660 "/dev/$$dv"; then
                    DECONZ_DEVICE="/dev/$$dv" DECONZ_BAUDRATE="$${bd:-0}" /start.sh & p=$$!; say running "$$dv"
                  else say wait mknod; fi ;;
                *) say wait invalid ;;
              esac
            else say "$$st" "$$dt"; fi
          else
            halt; s=""; say idle
          fi
          sleep 2 & wait $$!
        done
    restart: unless-stopped
    network_mode: host
    # nur diese Gerätearten darf der Wächter anlegen und deCONZ öffnen: ttyACM
    # (ConBee II), ttyUSB (ConBee III/ConBee), ttyAMA (RaspBee auf der GPIO-Leiste)
    device_cgroup_rules:
      - "c 166:* rmw"
      - "c 188:* rmw"
      - "c 204:* rmw"
    volumes:
      - ./deconz:/opt/deCONZ
      - type: volume            # Steuerdatei vom Gateway, Zustand zurück
        source: radio-ctl
        target: /gc-radio
        volume: { nocopy: true }
    environment:
      - TZ=${TZ:-Etc/UTC}
      - DECONZ_WEB_PORT=8090
      - DECONZ_WS_PORT=8091
      - DECONZ_VNC_MODE=0
      - DECONZ_UPNP=1
      - DEBUG_INFO=1
      - DEBUG_APS=0
      - DEBUG_ZCL=0
      - DEBUG_ZDP=0
      - DEBUG_OTA=0
      - DEBUG_HTTP=0
    healthcheck:
      test: ["CMD-SHELL", "case \"$$(cut -d' ' -f1 /gc-radio/deconz.state 2>/dev/null)\" in running) curl -fs -m 4 -o /dev/null http://127.0.0.1:8090/api/config ;; *) true ;; esac"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Zigbee mit zigbee2mqtt (docs/radio.md „zigbee2mqtt“) – für Sticks, die deCONZ
  # nicht spricht (Sonoff ZBDongle-E/-P, SkyConnect/ZBT-1, CC2652, EFR32). Profil
  # "zigbee2mqtt": startet nur mit `docker compose --profile zigbee2mqtt up -d`.
  # Die Datei aus GateControl enthält den Dienst ohne Profil, sobald für das
  # Gateway „zigbee2mqtt“ gewählt ist. Ein Stick bedient nur einen Dienst: deCONZ,
  # zigbee2mqtt und Thread nie auf demselben Stick.
  # Ein- und ausgeschaltet wird in GateControl: das Gateway schreibt
  # /gc-radio/z2m.env (Gerät, major:minor, Adapter, Konto am MQTT-Broker des
  # Gateways; 0600), der kleine Wächter legt genau diesen Geräteknoten an und
  # startet zigbee2mqtt (ohne Weboberfläche, nur MQTT an 127.0.0.1:1883). Ohne
  # z2m.env läuft nur der Wächter. Braucht Edge und MQTT (in GateControl an).
  zigbee2mqtt:
    profiles: ["zigbee2mqtt"]
    image: koenkk/zigbee2mqtt:2.14.2@sha256:addbfb08fcef2e4477de1535636118241e10d13e898fbe4d9faba8a4d7396311
    entrypoint:
      - /bin/sh
      - -c
      - |
        C=/gc-radio; D=/app/data; p=""; s=""; st=idle; dt=-
        say() { st="$$1"; dt="$${2:--}"; printf '%s %s %s\n' "$$st" "$$dt" "$$(date +%s)" >"$$C/.z2m.state" && mv -f "$$C/.z2m.state" "$$C/z2m.state"; }
        halt() { if [ -n "$$p" ]; then kill "$$p" 2>/dev/null; wait "$$p" 2>/dev/null; fi; p=""; }
        dead() { [ ! -e "/proc/$$1" ] || grep -q '^State:[[:space:]]*Z' "/proc/$$1/status" 2>/dev/null; }
        val() { sed -n "s/^$$1=\($$2\)$$/\1/p" "$$C/z2m.env"; }
        trap 'halt; say idle; exit 0' TERM INT
        while :; do
          if [ -f "$$C/z2m.env" ]; then
            n="$$(cksum <"$$C/z2m.env")"
            if [ -n "$$p" ] && dead "$$p"; then wait "$$p"; say exit "$$?"; p=""; sleep 8; fi
            if [ -z "$$p" ] || [ "$$n" != "$$s" ]; then
              halt; s="$$n"
              dv="$$(val DEVICE 'tty[A-Z]\{3\}[0-9]\{1,3\}')"
              mm="$$(sed -n 's/^DEV=\([0-9]\{3\}\):\([0-9]\{1,7\}\)$$/\1 \2/p' "$$C/z2m.env")"
              ad="$$(val ADAPTER 'ember\|zstack\|deconz')"
              bd="$$(val BAUD '[0-9]\{1,7\}')"
              mu="$$(val MQTT_USER '[a-z0-9-]\{1,32\}')"
              mp="$$(val MQTT_PASS '[A-Za-z0-9_-]\{24,64\}')"
              case "$$dv:$${mm%% *}:$$ad:$$mu:$$mp" in
                ttyACM*:166:?*:?*:?*|ttyUSB*:188:?*:?*:?*|ttyAMA*:204:?*:?*:?*)
                  rm -f "/dev/$$dv"
                  if mknod "/dev/$$dv" c $$mm && chmod 600 "/dev/$$dv"; then
                    [ -s "$$D/configuration.yaml" ] || printf '%s\n' 'version: 4' 'homeassistant:' '  enabled: false' 'frontend:' '  enabled: false' \
                      'advanced:' '  network_key: GENERATE' '  pan_id: GENERATE' '  ext_pan_id: GENERATE' '  log_output:' '    - console' >"$$D/configuration.yaml"
                    if [ "$${bd:-0}" != 0 ]; then export ZIGBEE2MQTT_CONFIG_SERIAL_BAUDRATE="$$bd"; else unset ZIGBEE2MQTT_CONFIG_SERIAL_BAUDRATE; fi
                    ZIGBEE2MQTT_CONFIG_SERIAL_PORT="/dev/$$dv" ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER="$$ad" \
                      ZIGBEE2MQTT_CONFIG_MQTT_SERVER=mqtt://127.0.0.1:1883 ZIGBEE2MQTT_CONFIG_MQTT_BASE_TOPIC=zigbee2mqtt \
                      ZIGBEE2MQTT_CONFIG_MQTT_USER="$$mu" ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD="$$mp" \
                      node /app/index.js & p=$$!; say running "$$dv"
                  else say wait mknod; fi ;;
                *) say wait invalid ;;
              esac
            else say "$$st" "$$dt"; fi
          else
            halt; s=""; say idle
          fi
          sleep 2 & wait $$!
        done
    working_dir: /app
    restart: unless-stopped
    network_mode: host        # MQTT des Gateways an 127.0.0.1:1883; kein eigener Port
    # nur diese Gerätearten darf der Wächter anlegen und zigbee2mqtt öffnen: ttyACM,
    # ttyUSB (USB-Sticks) und ttyAMA (Funkmodul auf der GPIO-Leiste)
    device_cgroup_rules:
      - "c 166:* rmw"
      - "c 188:* rmw"
      - "c 204:* rmw"
    # Vorrang hat das Gateway: weniger CPU-Anteil, bei Speichermangel trifft es zuerst zigbee2mqtt
    cpu_shares: 512
    oom_score_adj: 300
    mem_limit: 384m
    volumes:
      - z2m-data:/app/data      # configuration.yaml, Netz und Geräte (database.db)
      - type: volume            # Steuerdatei vom Gateway, Zustand zurück
        source: radio-ctl
        target: /gc-radio
        volume: { nocopy: true }
    environment:
      - TZ=${TZ:-Etc/UTC}
      - NODE_ENV=production
      - ZIGBEE2MQTT_DATA=/app/data
    healthcheck:
      test: ["CMD-SHELL", "[ $$(( $$(date +%s) - $$(cut -d' ' -f3 /gc-radio/z2m.state 2>/dev/null || echo 0) )) -lt 60 ]"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Thread mit dem OpenThread Border Router (docs/radio.md „Thread“) – für einen
  # Stick mit RCP-Firmware (SkyConnect/ZBT-1, ZBDongle-E, nRF52840). Profil
  # "thread": startet nur mit `docker compose --profile thread up -d`. Die Datei
  # aus GateControl enthält den Dienst ohne Profil, sobald Thread für das Gateway
  # eingeschaltet ist. Das Gateway schreibt /gc-radio/thread.env (Gerät,
  # major:minor, Baudrate, LAN-Schnittstelle), der Wächter legt den Geräteknoten
  # an und startet den Border Router: REST nur an 127.0.0.1:8081, Weboberfläche
  # nur an 127.0.0.1:8089, mDNS (_meshcop._udp) im LAN für Matter-Controller.
  # Braucht NET_ADMIN/NET_RAW (Schnittstelle wpan0, Routen, Firewall) und
  # /dev/net/tun. Die IPv6-Weiterleitung am Host meldet GateControl als Hinweis.
  otbr:
    profiles: ["thread"]
    image: openthread/otbr:latest@sha256:329299a92dd3554adfa324c2a1e5c5ebf8cbc0e47c53f01f7a6dbe16de7548e2
    entrypoint:
      - /bin/sh
      - -c
      - |
        C=/gc-radio; p=""; s=""; st=idle; dt=-
        say() { st="$$1"; dt="$${2:--}"; printf '%s %s %s\n' "$$st" "$$dt" "$$(date +%s)" >"$$C/.otbr.state" && mv -f "$$C/.otbr.state" "$$C/otbr.state"; }
        halt() { if [ -n "$$p" ]; then kill "$$p" 2>/dev/null; wait "$$p" 2>/dev/null; fi; p=""; }
        dead() { [ ! -e "/proc/$$1" ] || grep -q '^State:[[:space:]]*Z' "/proc/$$1/status" 2>/dev/null; }
        val() { sed -n "s/^$$1=\($$2\)$$/\1/p" "$$C/thread.env"; }
        trap 'halt; say idle; exit 0' TERM INT
        while :; do
          if [ -f "$$C/thread.env" ]; then
            n="$$(cksum <"$$C/thread.env")"
            if [ -n "$$p" ] && dead "$$p"; then wait "$$p"; say exit "$$?"; p=""; sleep 8; fi
            if [ -z "$$p" ] || [ "$$n" != "$$s" ]; then
              halt; s="$$n"
              dv="$$(val DEVICE 'tty[A-Z]\{3\}[0-9]\{1,3\}')"
              mm="$$(sed -n 's/^DEV=\([0-9]\{3\}\):\([0-9]\{1,7\}\)$$/\1 \2/p' "$$C/thread.env")"
              bd="$$(val BAUD '[0-9]\{4,7\}')"
              ni="$$(val INFRA '[a-zA-Z0-9][a-zA-Z0-9._-]\{0,14\}')"
              case "$$dv:$${mm%% *}:$$ni" in
                ttyACM*:166:?*|ttyUSB*:188:?*)
                  rm -f "/dev/$$dv"
                  if mknod "/dev/$$dv" c $$mm && chmod 600 "/dev/$$dv"; then
                    HTTP_HOST=127.0.0.1 HTTP_PORT=8089 REST_HOST=127.0.0.1 /app/etc/docker/test/docker_entrypoint.sh \
                      --radio-url "spinel+hdlc+uart:///dev/$$dv?uart-baudrate=$${bd:-460800}" -B "$$ni" --debug-level 5 & p=$$!; say running "$$dv"
                  else say wait mknod; fi ;;
                *) say wait invalid ;;
              esac
            else say "$$st" "$$dt"; fi
          else
            halt; s=""; say idle
          fi
          sleep 2 & wait $$!
        done
    restart: unless-stopped
    network_mode: host        # wpan0, Routen und mDNS im LAN; REST/Web nur an 127.0.0.1
    cap_add:
      - NET_ADMIN             # Schnittstelle wpan0, Routen, ip6tables/ipset des Border Routers
      - NET_RAW               # Neighbor Discovery / mDNS
    devices:
      - /dev/net/tun:/dev/net/tun
    # nur USB-Sticks (RCP): ttyACM und ttyUSB
    device_cgroup_rules:
      - "c 166:* rmw"
      - "c 188:* rmw"
    cpu_shares: 512
    oom_score_adj: 300
    mem_limit: 256m
    volumes:
      - otbr-data:/var/lib/thread   # Netzdaten (aktiver Datensatz) über Neustarts
      - type: volume            # Steuerdatei vom Gateway, Zustand zurück
        source: radio-ctl
        target: /gc-radio
        volume: { nocopy: true }
    environment:
      - TZ=${TZ:-Etc/UTC}
    healthcheck:
      test: ["CMD-SHELL", "[ $$(( $$(date +%s) - $$(cut -d' ' -f3 /gc-radio/otbr.state 2>/dev/null || echo 0) )) -lt 60 ]"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Lokale KI mit Ollama (docs/local-ai.md) – Profil "ki": startet nur mit
  # `docker compose --profile ki up -d` (oder COMPOSE_PROFILES=ki in .env) –
  # ohne den Schalter lädt niemand das ≈ 3-GB-Image. Die Datei aus GateControl
  # („docker-compose.yml herunterladen“) enthält den Dienst ohne Profil, sobald
  # die lokale KI für das Gateway eingeschaltet ist.
  # Ein- und ausgeschaltet wird in GateControl: das Gateway legt /gc-ai/run an,
  # der kleine Wächter startet `ollama serve` (nur 127.0.0.1:11435) bzw. beendet
  # es. Ohne run läuft nur der Wächter. Modelle lädt GateControl (KI-Anbieter).
  # Grafikkarte: zusätzlich eine der Dateien docker-compose.ki-nvidia.yml,
  # docker-compose.ki-amd.yml oder docker-compose.ki-intel.yml (in .env z. B.
  # COMPOSE_FILE=docker-compose.yml:docker-compose.ki-nvidia.yml). Die Datei aus
  # GateControl enthält das schon, wenn dort „Grafikkarte nutzen“ gewählt ist.
  # Der Wächter meldet in /gc-ai/ki.gpu, welche Geräte der Container sieht.
  ki:
    profiles: ["ki"]
    image: ollama/ollama:0.40.8@sha256:2b8eecdb85aa6ea67c381c8ecffec04b2658496cf2821a8f88b0485bdff198e8
    entrypoint:
      - /bin/sh
      - -c
      - |
        C=/gc-ai; p=""; n=0
        say() { printf '%s %s\n' "$$1" "$$(date +%s)" >"$$C/.ki.state" && mv -f "$$C/.ki.state" "$$C/ki.state"; }
        halt() { if [ -n "$$p" ]; then kill "$$p" 2>/dev/null; wait "$$p" 2>/dev/null; fi; p=""; }
        dead() { [ ! -e "/proc/$$1" ] || grep -q '^State:[[:space:]]*Z' "/proc/$$1/status" 2>/dev/null; }
        gpu() {
          { echo "mode $${GC_KI_GPU:-none}"; echo "at $$(date +%s)"
            for d in /dev/nvidia0 /dev/nvidiactl /dev/kfd /dev/dri/renderD*; do [ -e "$$d" ] && echo "dev $${d##*/}"; done
            if command -v nvidia-smi >/dev/null 2>&1; then
              timeout 10 nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader,nounits 2>/dev/null | head -n 4 | sed 's/^/nv /'
            fi
          } >"$$C/.ki.gpu" 2>/dev/null && mv -f "$$C/.ki.gpu" "$$C/ki.gpu"
        }
        trap 'halt; say idle; exit 0' TERM INT
        while :; do
          if [ $$((n % 30)) -eq 0 ]; then gpu; fi; n=$$((n + 1))
          if [ -f "$$C/run" ]; then
            if [ -n "$$p" ] && dead "$$p"; then wait "$$p"; say exit; p=""; sleep 8; fi
            if [ -z "$$p" ]; then ollama serve & p=$$!; fi
            say running
          else
            halt; say idle
          fi
          sleep 2 & wait $$!
        done
    restart: unless-stopped
    network_mode: host
    # Vorrang hat das Gateway: weniger CPU-Anteil, und wird der Speicher knapp,
    # beendet der Kernel zuerst das Modell – nie Gateway oder Tunnel
    cpu_shares: 256
    oom_score_adj: 800
    volumes:
      - ki-models:/root/.ollama
      - type: volume            # Steuerdatei vom Gateway, Zustand zurück
        source: ai-ctl
        target: /gc-ai
        volume: { nocopy: true }
    environment:
      - TZ=${TZ:-Etc/UTC}
      # nur lokal (das Gateway leitet weiter), nicht 11434 – ein vorhandenes Ollama stört nicht
      - OLLAMA_HOST=127.0.0.1:11435
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=10m
      # welche Grafikkarte die Compose-Datei gibt (none | nvidia | amd | intel) – der Wächter meldet es
      - GC_KI_GPU=none
    healthcheck:
      test: ["CMD-SHELL", "case \"$$(cut -d' ' -f1 /gc-ai/ki.state 2>/dev/null)\" in running) ollama list >/dev/null ;; *) true ;; esac"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # Kameras im Heimnetz (docs/cameras.md) – Profil "kameras": startet nur mit
  # `docker compose --profile kameras up -d` (oder COMPOSE_PROFILES=kameras in
  # .env). Die Datei aus GateControl („docker-compose.yml herunterladen“)
  # enthält den Dienst ohne Profil, sobald Kameras für das Gateway eingeschaltet sind.
  # Vom Image wird nur ffmpeg (Alpine-Paket) benutzt – mediamtx selbst startet
  # nicht. Der Einstieg wartet auf /gc-cam/kameras.sh, das das Gateway schreibt
  # (die Logik kommt so mit jedem Gateway-Update), und führt es aus: je Auftrag
  # /gc-cam/run/<id>.env ein ffmpeg mit Stream-Kopie in einen HLS-Ring unter
  # /gc-cam/media/<id>/. Kein Port, keine Rechte.
  kameras:
    profiles: ["kameras"]
    image: bluenviron/mediamtx:1.21.3-ffmpeg@sha256:208e9f1740a09a5ee63b6308e77ce0d54fce0456462f640e6bd9acfc62ebb5a2
    entrypoint:
      - /bin/sh
      - -c
      - |
        while [ ! -s /gc-cam/kameras.sh ]; do sleep 2; done
        exec /bin/sh /gc-cam/kameras.sh
    restart: unless-stopped
    network_mode: host        # die Kameras sind im LAN; es wird kein Port geöffnet
    user: "0:0"               # liest die Steuerdateien des Gateways (root, 0600) – ohne jede Capability
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    # Vorrang hat das Gateway: weniger CPU-Anteil, bei Speichermangel trifft es zuerst ffmpeg
    cpu_shares: 512
    oom_score_adj: 500
    mem_limit: 768m
    pids_limit: 64
    depends_on:
      - gateway               # legt cam-ctl an und schreibt kameras.sh
    volumes:
      - type: volume            # Steuerdateien vom Gateway, Bild-Ring zurück
        source: cam-ctl
        target: /gc-cam
        volume: { nocopy: true }
    environment:
      - TZ=${TZ:-Etc/UTC}
    healthcheck:
      test: ["CMD-SHELL", "[ ! -s /gc-cam/kameras.sh ] || [ $$(( $$(date +%s) - $$(cut -d' ' -f2 /gc-cam/kameras.state 2>/dev/null || echo 0) )) -lt 60 ]"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # tmpfs, geteilt: der Gateway-Container (root) legt den Socket an, das
  # setgid-Bit gibt ihm die Gruppe 61001 → der Edge-Container kann ihn
  # benutzen, aber nicht löschen oder ersetzen.
  edge-run:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,uid=0,gid=61001,mode=2750"
  # tmpfs, geteilt: der Edge-Host schreibt seine Zusammenfassung, das Gateway liest.
  edge-status:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,uid=61001,gid=61001,mode=0755"
  # tmpfs: Broker-Dateien, geschrieben vom Gateway-Container, gelesen vom mqtt-Dienst
  edge-mqtt-conf:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,uid=0,gid=61001,mode=2750"
  # Pakete der Edge-Teile + gc.store (übernimmt Besitzer 61001 aus dem Image)
  edge-state:
  # Kopie der Broker-Dateien + Mosquitto-Daten (data/), Besitzer 61001
  edge-mqtt:
  # tmpfs, geteilt: Steuerdateien des Gateways für deconz, zigbee2mqtt und otbr und deren Zustand
  radio-ctl:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,uid=0,gid=0,mode=0755"
  # tmpfs, geteilt: Steuerdatei des Gateways für den Dienst ki und dessen Zustand
  ai-ctl:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,uid=0,gid=0,mode=0755"
  # zigbee2mqtt: configuration.yaml, Zigbee-Netz und Geräte
  z2m-data:
  # Thread Border Router: aktiver Datensatz und Netzdaten
  otbr-data:
  # die Modelle der lokalen KI (je Modell 1–6 GB)
  ki-models:
  # tmpfs, geteilt: Steuerdateien des Gateways für den Dienst kameras und der Bild-Ring (≈ 15 MB je Kamera)
  cam-ctl:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=256m,uid=0,gid=0,mode=0700"
  # Clips und Vorschaubilder der Kameras (wenn GC_CAMERA_DIR nicht gesetzt ist)
  cam-recordings:
