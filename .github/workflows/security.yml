name: Security & Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      # Blockierend: high/critical in Produktionsabhängigkeiten — das, was im
      # Image landet. Devtools (stryker, supertest) laufen nie in Produktion
      # und werden unten nur gemeldet.
      - name: npm audit (production, high/critical)
        run: npm audit --omit=dev --audit-level=high
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: npm audit (all deps, informational)
        continue-on-error: true
        run: npm audit --audit-level=high
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  eslint-security:
    name: ESLint Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install ESLint with security plugin
        run: npm install --no-save eslint@8 eslint-plugin-security@1.7.1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Create security ESLint config
        run: |
          cat > .eslintrc.security.json << 'ESLINTEOF'
          {
            "plugins": ["security"],
            "extends": ["plugin:security/recommended"],
            "env": { "node": true, "es2022": true },
            "parserOptions": { "ecmaVersion": 2022 },
            "rules": {
              "security/detect-eval-with-expression": "error",
              "security/detect-non-literal-fs-filename": "warn",
              "security/detect-non-literal-require": "warn",
              "security/detect-possible-timing-attacks": "warn",
              "security/detect-child-process": "warn"
            }
          }
          ESLINTEOF

      - name: Run ESLint security scan
        run: npx eslint -c .eslintrc.security.json "src/**/*.js" "public/**/*.js" --no-eslintrc --format stylish || true

  trivy:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The npm token is a BuildKit secret (Dockerfile: RUN --mount=type=secret),
      # never a build arg. --check fails the job on any Dockerfile lint warning
      # (e.g. SecretsUsedInArgOrEnv) before the actual build.
      - name: Check Dockerfile
        run: docker build --check .
        env:
          DOCKER_BUILDKIT: '1'

      - name: Build Docker image
        run: docker build --secret id=npm_token,env=NODE_AUTH_TOKEN -t gatecontrol:security-scan .
        env:
          DOCKER_BUILDKIT: '1'
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      # The token must not end up in the image: neither in its history nor in
      # its config (env, labels, ...). grep -q prints nothing, so the token is
      # never written to the log.
      - name: Verify the npm token is not in the image
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::GH_PACKAGES_TOKEN is not available to this job"
            exit 1
          fi
          if docker history --no-trunc --format '{{.CreatedBy}}' gatecontrol:security-scan | grep -qF -- "$NODE_AUTH_TOKEN" ||
             docker image inspect gatecontrol:security-scan | grep -qF -- "$NODE_AUTH_TOKEN"; then
            echo "::error::The npm token was found in the image history or config"
            exit 1
          fi
          echo "npm token found neither in the image history nor in its config"

      # WAF (docs/feature-waf.md): the image must ship Caddy with Coraza —
      # without http.handlers.waf the generator silently omits every WAF handler.
      - name: Verify Caddy WAF module
        run: docker run --rm --entrypoint caddy gatecontrol:security-scan list-modules | grep -qx http.handlers.waf

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'gatecontrol:security-scan'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
