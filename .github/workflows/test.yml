name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      browser_scenarios:
        description: 'Browser scenarios to run (space separated, or "all")'
        required: false
        default: 'all'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # 24 = Laufzeit im Image (Dockerfile node:24-alpine); 22 = kleinste
    # Version aus engines.node, damit die Untergrenze nicht nur behauptet ist.
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://npm.pkg.github.com/
          scope: '@callmetechie'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Vendored template drift check
        run: node scripts/check-vendored-templates.js

      # JSON.parse keeps the last value of a duplicate key — three of them sat
      # in en.json for months without a single red test.
      - name: Duplicate i18n keys
        run: node scripts/check-i18n-duplicates.js

      - name: Run tests with coverage
        run: npx c8 --reporter=text --reporter=lcov --lines 40 npm test
        env:
          NODE_ENV: test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-node${{ matrix.node }}
          path: coverage/
          retention-days: 3

  # Storage targets (docs/storage-targets.md) against real servers: S3
  # (moto), WebDAV (wsgidav) and SMB (Samba with smbclient, as in the image).
  storage-targets:
    name: storage targets (S3, WebDAV, SMB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          scope: '@callmetechie'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Start S3, WebDAV and SMB test servers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends samba smbclient
          python3 -m venv /tmp/st
          /tmp/st/bin/pip install -q "moto[server]==5.2.4" "wsgidav==4.4.0" "cheroot==11.1.2"
          nohup /tmp/st/bin/moto_server -H 127.0.0.1 -p 5055 > /tmp/moto.log 2>&1 &
          mkdir -p /tmp/davroot
          printf '%s\n' 'host: 127.0.0.1' 'port: 8085' 'provider_mapping:' '  "/dav": "/tmp/davroot"' 'http_authenticator:' \
            '  domain_controller: null' '  accept_basic: true' '  accept_digest: false' '  default_to_digest: false' \
            'simple_dc:' '  user_mapping:' '    "*":' '      "gc":' '        password: "secret123"' > /tmp/wsgidav.yaml
          nohup /tmp/st/bin/wsgidav --config /tmp/wsgidav.yaml > /tmp/wsgidav.log 2>&1 &
          mkdir -p /tmp/smbshare /tmp/smbrun/ncalrpc && chmod 777 /tmp/smbshare
          printf '%s\n' '[global]' '  workgroup = WG' '  server role = standalone server' '  map to guest = never' '  smb ports = 4445' \
            '  pid directory = /tmp/smbrun' '  lock directory = /tmp/smbrun' '  state directory = /tmp/smbrun' '  cache directory = /tmp/smbrun' \
            '  private dir = /tmp/smbrun' '  ncalrpc dir = /tmp/smbrun/ncalrpc' '  log file = /tmp/smbrun/log.%m' '  server min protocol = SMB2' \
            '[share]' '  path = /tmp/smbshare' '  read only = no' '  valid users = gctest' > /tmp/smb.conf
          sudo useradd -M gctest
          printf 'pass1234\npass1234\n' | sudo smbpasswd -c /tmp/smb.conf -s -a gctest
          sudo smbd -s /tmp/smb.conf -D
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:5055/ && curl -s -o /dev/null -u gc:secret123 -X PROPFIND http://127.0.0.1:8085/dav/ \
              && smbclient //127.0.0.1/share -p 4445 -U gctest%pass1234 -c ls > /dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -sf -X PUT http://127.0.0.1:5055/gc-test-bucket

      - name: Run the live storage target tests
        run: node --test --test-force-exit tests/storage_targets_live.test.js
        env:
          NODE_ENV: test
          GC_TEST_S3_ENDPOINT: http://127.0.0.1:5055
          GC_TEST_S3_BUCKET: gc-test-bucket
          GC_TEST_S3_KEY: testing
          GC_TEST_S3_SECRET: testing
          GC_TEST_S3_NO_AUTH: '1'
          GC_TEST_WEBDAV_URL: http://127.0.0.1:8085/dav
          GC_TEST_WEBDAV_USER: gc
          GC_TEST_WEBDAV_PASSWORD: secret123
          GC_TEST_SMB_HOST: 127.0.0.1
          GC_TEST_SMB_PORT: '4445'
          GC_TEST_SMB_SHARE: share
          GC_TEST_SMB_USER: gctest
          GC_TEST_SMB_PASSWORD: pass1234

      - name: Server logs
        if: failure()
        run: tail -n 50 /tmp/moto.log /tmp/wsgidav.log; sudo tail -n 50 /tmp/smbrun/log.smbd || true

  eslint-security:
    name: ESLint Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          scope: '@callmetechie'

      - name: Install ESLint with security plugin
        run: npm install --no-save eslint@8 eslint-plugin-security@1.7.1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Create security ESLint config
        run: |
          cat > .eslintrc.security.json << 'ESLINTEOF'
          {
            "plugins": ["security"],
            "extends": ["plugin:security/recommended"],
            "env": { "node": true, "es2022": true },
            "parserOptions": { "ecmaVersion": 2022 },
            "rules": {
              "security/detect-eval-with-expression": "error",
              "security/detect-non-literal-fs-filename": "warn",
              "security/detect-non-literal-require": "warn",
              "security/detect-possible-timing-attacks": "warn",
              "security/detect-child-process": "warn"
            }
          }
          ESLINTEOF

      - name: Run ESLint security scan
        run: npx eslint -c .eslintrc.security.json "src/**/*.js" "public/**/*.js" --no-eslintrc --format stylish

      # Catches missing/renamed imports that only blow up at request time
      # (ReferenceError → 500). Two router splits shipped exactly that bug.
      # src/ only: public/ scripts share globals across <script> tags by design.
      - name: Create no-undef ESLint config
        run: |
          cat > .eslintrc.noundef.json << 'ESLINTEOF'
          {
            "env": { "node": true, "es2022": true },
            "parserOptions": { "ecmaVersion": 2022, "sourceType": "script" },
            "rules": { "no-undef": "error" }
          }
          ESLINTEOF

      - name: Run ESLint no-undef scan (src)
        run: npx eslint -c .eslintrc.noundef.json "src/**/*.js" --no-eslintrc --format stylish

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    # Der Playwright-Container bringt Chromium und alle Systembibliotheken
    # mit; das npm-Paket selbst kommt mit --no-save dazu, damit package.json
    # und package-lock.json unangetastet bleiben.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      NODE_ENV: test
      GC_DATA_DIR: /tmp/gc-e2e
      GC_DB_PATH: /tmp/gc-e2e/gatecontrol.db
      GC_CADDY_DATA_DIR: /tmp/gc-e2e/caddy
      GC_BACKUP_DIR: /tmp/gc-e2e/backups
      GC_DNS_HOSTS_FILE: /tmp/gc-e2e/dns/peers.hosts
      GC_WG_CONFIG_PATH: /tmp/gc-e2e/wireguard/wg0.conf
      GC_SUPPORT_BUNDLE_DIR: /tmp/gc-e2e/support
      GC_HOST: 127.0.0.1
      # Host name, not IP: WebAuthn refuses IP addresses as RP ID, and the
      # passkey scenario runs against this origin (same server as BASE).
      GC_BASE_URL: http://localhost:3000
      GC_ADMIN_USER: e2e_admin
      GC_ADMIN_PASSWORD: 'E2eTest!Pass123'
      GC_DEFAULT_LANGUAGE: en
      GC_LOG_LEVEL: warn
      GC_RATE_LIMIT_LOGIN: '100000'
      GC_RATE_LIMIT_API: '100000'
      GC_RATE_LIMIT_GATEWAY: '100000'
      BASE: http://127.0.0.1:3000
      E2E_OUT: /tmp/gc-e2e/shots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          scope: '@callmetechie'

      # Like the Docker builder: better-sqlite3 ships its N-API prebuilds in
      # the package, but a plain `npm ci` still runs npm's implicit
      # `node-gyp rebuild` for it (binding.gyp), and this container has no
      # make. argon2 is the only package with an install step we need (its
      # node-gyp-build only selects the prebuild).
      - run: npm ci --ignore-scripts && npm rebuild argon2
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      # Kein Eintrag in package.json/package-lock.json: Playwright ist Werkzeug
      # des Jobs, keine Abhängigkeit des Projekts. Die Browser liegen schon im
      # Container-Image.
      - name: Add the Playwright client (not a project dependency)
        # In its own directory with its own npm config: inside the project,
        # npm resolves the whole tree and fails with E401 on the private
        # @callmetechie package (the job's registry auth is only set for the
        # `npm ci` step above). The browsers are already in the image.
        run: |
          mkdir -p /tmp/pw
          cd /tmp/pw
          printf '{"name":"pw-client","private":true}\n' > package.json
          : > .npmrc
          npm install --no-package-lock --userconfig /tmp/pw/.npmrc --registry https://registry.npmjs.org/ playwright@1.63.0
          node -e "require('/tmp/pw/node_modules/playwright');console.log('playwright ready')"

      # Ein Schlüsselpaar für Seed UND App: das TOTP-Geheimnis des
      # Fixture-Benutzers liegt mit GC_ENCRYPTION_KEY verschlüsselt in der DB.
      - name: Test keys for this run
        run: |
          rnd() { node -e "console.log(require('node:crypto').randomBytes(32).toString('hex'))"; }
          echo "GC_SECRET=$(rnd)" >> "$GITHUB_ENV"
          echo "GC_ENCRYPTION_KEY=$(rnd)" >> "$GITHUB_ENV"

      - name: Seed the test database
        run: node tests/e2e/seed.js

      - name: Start the app
        run: |
          nohup node src/server.js > /tmp/gc-e2e-app.log 2>&1 &
          disown || true
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/login >/dev/null && exit 0
            sleep 1
          done
          echo "app did not come up:"; cat /tmp/gc-e2e-app.log; exit 1

      # Pflichtsatz bei push/PR, bei workflow_dispatch der gewählte Satz.
      - name: Browser scenarios
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: node tests/e2e/run.js ${{ github.event_name == 'workflow_dispatch' && inputs.browser_scenarios || 'login zones security passkey dashboard settings users portal portalstart pluginviewport notifications support storage' }}

      - name: App log
        if: failure()
        run: cat /tmp/gc-e2e-app.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-screenshots
          path: /tmp/gc-e2e/shots/
          retention-days: 3
          if-no-files-found: ignore

  mutation:
    name: Mutation tests (gateway)
    runs-on: ubuntu-latest
    needs: test
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'mutation-test')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          scope: '@callmetechie'
      - name: Install deps
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      - name: Mutation test
        run: npx stryker run || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 3
