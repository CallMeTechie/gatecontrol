name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      browser_scenarios:
        description: 'Browser scenarios to run (space separated, or "all")'
        required: false
        default: 'all'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/
          scope: '@callmetechie'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Vendored template drift check
        run: node scripts/check-vendored-templates.js

      # JSON.parse keeps the last value of a duplicate key — three of them sat
      # in en.json for months without a single red test.
      - name: Duplicate i18n keys
        run: node scripts/check-i18n-duplicates.js

      - name: Run tests with coverage
        run: npx c8 --reporter=text --reporter=lcov --lines 40 npm test
        env:
          NODE_ENV: test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  eslint-security:
    name: ESLint Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/
          scope: '@callmetechie'

      - name: Install ESLint with security plugin
        run: npm install --no-save eslint@8 eslint-plugin-security@1.7.1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Create security ESLint config
        run: |
          cat > .eslintrc.security.json << 'ESLINTEOF'
          {
            "plugins": ["security"],
            "extends": ["plugin:security/recommended"],
            "env": { "node": true, "es2022": true },
            "parserOptions": { "ecmaVersion": 2022 },
            "rules": {
              "security/detect-eval-with-expression": "error",
              "security/detect-non-literal-fs-filename": "warn",
              "security/detect-non-literal-require": "warn",
              "security/detect-possible-timing-attacks": "warn",
              "security/detect-child-process": "warn"
            }
          }
          ESLINTEOF

      - name: Run ESLint security scan
        run: npx eslint -c .eslintrc.security.json "src/**/*.js" "public/**/*.js" --no-eslintrc --format stylish

      # Catches missing/renamed imports that only blow up at request time
      # (ReferenceError → 500). Two router splits shipped exactly that bug.
      # src/ only: public/ scripts share globals across <script> tags by design.
      - name: Create no-undef ESLint config
        run: |
          cat > .eslintrc.noundef.json << 'ESLINTEOF'
          {
            "env": { "node": true, "es2022": true },
            "parserOptions": { "ecmaVersion": 2022, "sourceType": "script" },
            "rules": { "no-undef": "error" }
          }
          ESLINTEOF

      - name: Run ESLint no-undef scan (src)
        run: npx eslint -c .eslintrc.noundef.json "src/**/*.js" --no-eslintrc --format stylish

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    # Der Playwright-Container bringt Chromium und alle Systembibliotheken
    # mit; das npm-Paket selbst kommt mit --no-save dazu, damit package.json
    # und package-lock.json unangetastet bleiben.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      NODE_ENV: test
      GC_DATA_DIR: /tmp/gc-e2e
      GC_DB_PATH: /tmp/gc-e2e/gatecontrol.db
      GC_CADDY_DATA_DIR: /tmp/gc-e2e/caddy
      GC_BACKUP_DIR: /tmp/gc-e2e/backups
      GC_DNS_HOSTS_FILE: /tmp/gc-e2e/dns/peers.hosts
      GC_WG_CONFIG_PATH: /tmp/gc-e2e/wireguard/wg0.conf
      GC_HOST: 127.0.0.1
      GC_BASE_URL: http://127.0.0.1:3000
      GC_ADMIN_USER: e2e_admin
      GC_ADMIN_PASSWORD: 'E2eTest!Pass123'
      GC_DEFAULT_LANGUAGE: en
      GC_LOG_LEVEL: warn
      GC_RATE_LIMIT_LOGIN: '100000'
      GC_RATE_LIMIT_API: '100000'
      GC_RATE_LIMIT_GATEWAY: '100000'
      BASE: http://127.0.0.1:3000
      E2E_OUT: /tmp/gc-e2e/shots
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/
          scope: '@callmetechie'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      # Kein Eintrag in package.json/package-lock.json: Playwright ist Werkzeug
      # des Jobs, keine Abhängigkeit des Projekts. Die Browser liegen schon im
      # Container-Image.
      - name: Add the Playwright client (not a project dependency)
        # In its own directory with its own npm config: inside the project,
        # npm resolves the whole tree and fails with E401 on the private
        # @callmetechie package (the job's registry auth is only set for the
        # `npm ci` step above). The browsers are already in the image.
        run: |
          mkdir -p /tmp/pw
          cd /tmp/pw
          printf '{"name":"pw-client","private":true}\n' > package.json
          : > .npmrc
          npm install --no-package-lock --userconfig /tmp/pw/.npmrc --registry https://registry.npmjs.org/ playwright@1.63.0
          node -e "require('/tmp/pw/node_modules/playwright');console.log('playwright ready')"

      # Ein Schlüsselpaar für Seed UND App: das TOTP-Geheimnis des
      # Fixture-Benutzers liegt mit GC_ENCRYPTION_KEY verschlüsselt in der DB.
      - name: Test keys for this run
        run: |
          rnd() { node -e "console.log(require('node:crypto').randomBytes(32).toString('hex'))"; }
          echo "GC_SECRET=$(rnd)" >> "$GITHUB_ENV"
          echo "GC_ENCRYPTION_KEY=$(rnd)" >> "$GITHUB_ENV"

      - name: Seed the test database
        run: node tests/e2e/seed.js

      - name: Start the app
        run: |
          nohup node src/server.js > /tmp/gc-e2e-app.log 2>&1 &
          disown || true
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/login >/dev/null && exit 0
            sleep 1
          done
          echo "app did not come up:"; cat /tmp/gc-e2e-app.log; exit 1

      # Pflichtsatz bei push/PR, bei workflow_dispatch der gewählte Satz.
      - name: Browser scenarios
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: node tests/e2e/run.js ${{ github.event_name == 'workflow_dispatch' && inputs.browser_scenarios || 'login zones security' }}

      - name: App log
        if: failure()
        run: cat /tmp/gc-e2e-app.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: /tmp/gc-e2e/shots/
          if-no-files-found: ignore

  mutation:
    name: Mutation tests (gateway)
    runs-on: ubuntu-latest
    needs: test
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'mutation-test')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/
          scope: '@callmetechie'
      - name: Install deps
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      - name: Mutation test
        run: npx stryker run || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
