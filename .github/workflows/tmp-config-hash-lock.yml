name: tmp config-hash lock

# One-off helper on this branch only: lets npm regenerate package-lock.json for
# @callmetechie/gatecontrol-config-hash@1.3.1 with the packages token and prints
# the diff. Removed again before the PR is merged.

on:
  push:
    branches: [deps/config-hash-1.3.1]

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          scope: '@callmetechie'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      - name: Lock diff
        run: |
          echo "=====LOCKDIFF-BEGIN====="
          git diff --no-color package-lock.json | base64 -w0
          echo
          echo "=====LOCKDIFF-END====="
