name: Build & Release

on:
  push:
    branches: [master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  packages: write

jobs:
  decide:
    name: Release needed?
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Check commit type
        id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Squash merges put the PR title on the first line. ci/docs/test/style
          # and chore commits (incl. our own "chore: bump version") land on the
          # default branch without a release and ship with the next fix/feat.
          # chore(deps) stays releasable: dependency updates can carry fixes.
          FIRST_LINE=$(printf '%s\n' "$COMMIT_MSG" | head -n1)
          if printf '%s' "$FIRST_LINE" | grep -qE '^chore\(deps(-dev)?\)!?:'; then
            RELEASE=true
          elif printf '%s' "$FIRST_LINE" | grep -qE '^(ci|docs|test|style|chore)(\([^)]*\))?!?:'; then
            RELEASE=false
          else
            RELEASE=true
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "First line: $FIRST_LINE -> release=$RELEASE"

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: decide
    if: needs.decide.outputs.release == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          scope: '@callmetechie'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      - name: npm audit (production, high/critical)
        run: npm audit --omit=dev --audit-level=high
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          scope: '@callmetechie'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      - run: npm test
        env:
          NODE_ENV: test

  release:
    needs: [decide, test, security-gate]
    runs-on: ubuntu-latest
    # decide skips ci/docs/test/style/chore commits, incl. our own version bump (no loop)
    if: needs.decide.outputs.release == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Determine version bump
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)
          if echo "$FIRST_LINE" | grep -qE "^feat(\(.+\))?:"; then
            MINOR=$((MINOR + 1))
            PATCH=0
            BUMP="minor"
          else
            PATCH=$((PATCH + 1))
            BUMP="patch"
          fi

          NEW="${MAJOR}.${MINOR}.${PATCH}"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"
          echo "Version: $CURRENT → $NEW ($BUMP)"

      - name: Check if tag already exists
        id: check_tag
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version in package.json
        if: steps.check_tag.outputs.exists == 'false'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new }}
        run: npm version "$NEW_VERSION" --no-git-tag-version

      - name: Update CHANGELOG.md
        if: steps.check_tag.outputs.exists == 'false'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Logik in scripts/changelog-release.js, damit sie testbar ist
          # (tests/changelog_release.test.js). Der frühere awk-Einzeiler schob
          # den erzeugten Block blind hinter "# Changelog" und ließ einen
          # handgepflegten [Unreleased]-Abschnitt darunter liegen — dessen
          # Beschreibungen erschienen dadurch in keinem Release.
          node scripts/changelog-release.js \
            "$NEW_VERSION" "$(date +%Y-%m-%d)" "$(echo "$COMMIT_MSG" | head -1)"

      - name: Commit version bump
        if: steps.check_tag.outputs.exists == 'false'
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          NEW_VERSION: ${{ steps.bump.outputs.new }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add package.json package-lock.json CHANGELOG.md 2>/dev/null || true
          git add package.json
          git commit -m "chore: bump version to $NEW_VERSION"
          git tag "$TAG"
          git push origin master --tags

      # ─── GHCR: Build & Push ───────────────────────────
      - name: Set image name
        if: steps.check_tag.outputs.exists == 'false'
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.check_tag.outputs.exists == 'false'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.check_tag.outputs.exists == 'false'
        with:
          context: .
          push: true
          build-args: |
            NODE_AUTH_TOKEN=${{ secrets.GH_PACKAGES_TOKEN }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.bump.outputs.new }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # update.sh reads this label to name a rolled-back release in the dashboard.
          labels: org.opencontainers.image.version=${{ steps.bump.outputs.new }}

      # ─── Release: Offline-Paket ───────────────────────
      - name: Build image for offline package
        if: steps.check_tag.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: docker build --build-arg "NODE_AUTH_TOKEN=$NODE_AUTH_TOKEN" -t gatecontrol:latest .

      - name: Export image
        if: steps.check_tag.outputs.exists == 'false'
        run: docker save gatecontrol:latest | gzip > gatecontrol-image.tar.gz

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: GateControl ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
          files: |
            gatecontrol-image.tar.gz
            deploy/docker-compose.yml
            deploy/setup.sh
            .env.example
