version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    reviewers:
      - "CallMeTechie"

  - package-ecosystem: "github-actions"
    directory: "/"
    # "ci:" commits land without a release (see release.yml "decide").
    commit-message:
      prefix: "ci"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "ci"
