version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    versioning-strategy: increase
    # Minor/patch updates arrive as one grouped PR (auto-merged once CI is
    # green, see workflows/dependabot-auto-merge.yml); majors stay separate.
    groups:
      npm:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Private GitHub Packages dep — versioned manually with its own releases.
      - dependency-name: "@callmetechie/gatecontrol-config-hash"

  - package-ecosystem: "github-actions"
    directory: "/"
    # "ci:" commits land without a release (see release.yml "decide").
    commit-message:
      prefix: "ci"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
